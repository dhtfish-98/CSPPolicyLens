[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csp-policy-lens"
version = "0.1.1"
description = "Offline positioned CSP2/3 effective policy and conjunction evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES/csp-evaluator-Apache-2.0.txt"]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
csp-policy-lens = "csp_policy_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csp_policy_lens = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
