name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Source checks and build
        run: |
          python -m pip install build setuptools==82.0.1 wheel==0.48.0
          PYTHONPATH=src python -m unittest discover -s tests
          python -m build --no-isolation
      - name: Fresh wheel outside source imports
        run: |
          python -m venv .consumer
          .consumer/bin/python -m pip install --no-index --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.consumer/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests"
